name: Agnes 9-16 AI Video Generator

on:
  workflow_dispatch:
    inputs:
      job_payload:
        description: 'JSON Job Payload from Multi-Post Hub'
        required: true
        type: string

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg, Pango & Devanagari Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick espeak-ng fontconfig fonts-noto-core fonts-lohit-deva
          fc-cache -fv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Kokoro-82M Model Files
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro-onnx
          key: kokoro-onnx-v1.0-models

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Video Engine
        env:
          JOB_PAYLOAD: ${{ github.event.inputs.job_payload }}
          WEBHOOK_SECRET: ${{ secrets.AGNES_WEBHOOK_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python .github/workflows/scripts/runner_compose.py
